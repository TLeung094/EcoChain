# ==========================================
#        EcoChain 生態連鎖系統設定檔
# ==========================================

# 資料庫設定 (目前使用本機 SQLite，不需修改此處即可運作)
# 未來若要切換為 MySQL，可在這裡新增欄位

# ==========================================
# ⏳ 生態衰退系統 (Decay System)
# ==========================================
decay:
  # 衰退檢查的週期 (單位: Ticks, 20 ticks = 1 秒)
  # 預設: 12000 (10 分鐘)
  interval-ticks: 12000

  # 每次衰退扣除的分數
  amount: 2

# ==========================================
# ⚖️ 行為權重設定 (Action Weights)
# 設定玩家各種行為會增加或減少多少分數
# ==========================================
weights:
  flora:
    plant-sapling: 2    # 種植樹苗/花朵 (+分)
    break-log: -1       # 砍伐原木 (-分)
  fauna:
    breed-animal: 3     # 繁殖動物 (+分)
    kill-animal: -2     # 殺死動物 (-分)
  aqua:
    place-water: 2      # 放置水桶 (+分)
    pickup-water: -1    # 撈取水源 (-分)
    place-lava: -5      # 放置岩漿 (-分，嚴重汙染)

# ==========================================
# 🎁 任務系統設定 (Quest System)
# ==========================================
quest:
  # 完成每日任務給予的經驗值獎勵
  exp-reward: 50